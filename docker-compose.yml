name: syncnotes

# `docker compose up --build`               → full stack (web + api + 2× collab + postgres + redis)
# `docker compose up -d postgres redis`     → infrastructure only, for local development

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: syncnotes
      POSTGRES_PASSWORD: syncnotes
      POSTGRES_DB: syncnotes
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U syncnotes -d syncnotes']
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  redisdata:
