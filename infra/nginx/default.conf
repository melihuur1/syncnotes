# SyncNotes edge: serves the SPA and reverse-proxies the API and the collaboration servers.
# Everything is same-origin, so auth cookies stay first-party and SameSite works as intended.

# Re-resolve service names through Docker's DNS so restarted/recreated containers (new IPs)
# are picked up without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream syncnotes_api {
  zone syncnotes_api 64k;
  server api:4000 resolve;
  keepalive 16;
}

# Two collaboration instances behind round-robin — clients of the same note land on
# different instances on purpose; Redis keeps them in sync.
upstream syncnotes_collab {
  zone syncnotes_collab 64k;
  server collab-1:1234 resolve;
  server collab-2:1234 resolve;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 1m;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.inc;

  location /api/ {
    proxy_pass http://syncnotes_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /collab {
    proxy_pass http://syncnotes_collab/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security-headers.inc;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.inc;
    try_files $uri $uri/ /index.html;
  }
}
